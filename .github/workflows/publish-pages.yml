name: Publish GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "articles/**"
      - "site/**"
      - "scripts/prepare_pages.py"
      - "scripts/verify_pages_output.py"
      - "scripts/syndicate_dev.py"
      - ".github/workflows/publish-pages.yml"
      - ".github/workflows/publish-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare published articles
        run: python scripts/prepare_pages.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Verify Pages output
        run: python scripts/verify_pages_output.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
