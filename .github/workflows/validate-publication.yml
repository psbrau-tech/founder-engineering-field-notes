name: Validate publication

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate public content
        run: python scripts/validate_publication.py

      - name: Validate DEV syndication payloads
        run: python scripts/syndicate_dev.py --all --dry-run

      - name: Prepare Pages input
        run: python scripts/prepare_pages.py

      - name: Build Pages preflight
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Verify Pages output
        run: python scripts/verify_pages_output.py
